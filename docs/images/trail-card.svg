<svg xmlns="http://www.w3.org/2000/svg" class="trail-card" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Trail card. My route to Staff Engineer. Climb: 34–40 months. Jump: 18–23 months. Pivot: 42–49 months." font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, sans-serif"><defs><linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141c3f"></stop><stop offset="1" stop-color="#0a0f22"></stop></linearGradient></defs><rect width="1200" height="630" rx="28" fill="url(#card-bg)"></rect><text x="72" y="76" fill="#9aa5d6" font-size="22" font-weight="600" letter-spacing="2">ORIONMATTER</text><text x="72" y="150" fill="#ffffff" font-size="48" font-weight="700">My route to Staff Engineer</text><text x="72" y="196" fill="#c9d1f2" font-size="26">Backend  ·  L5  ·  Goal: Staff Engineer  ·  South India</text><g><circle cx="82" cy="300" r="9" fill="#7DB4FF"></circle><text x="108" y="308" fill="#ffffff" font-size="30" font-weight="650">Climb</text><g><rect x="207" y="280" width="128" height="32" rx="16" fill="#2a3470"></rect><text x="271" y="302" fill="#cfd6ff" font-size="18" font-weight="650" text-anchor="middle">Start here</text></g><text x="108" y="340" fill="#c9d1f2" font-size="22">34–40 months  ·  74–92% · 55 engineers</text><line x1="640" x2="1120" y1="300" y2="300" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"></line><rect x="912" y="290" width="48" height="20" rx="10" fill="#7DB4FF" fill-opacity="0.4"></rect><circle cx="936" cy="300" r="8" fill="#7DB4FF"></circle></g><g><circle cx="82" cy="392" r="9" fill="#FF9F8F"></circle><text x="108" y="400" fill="#ffffff" font-size="30" font-weight="650">Jump</text><text x="108" y="432" fill="#c9d1f2" font-size="22">18–23 months  ·  56–78% · 65 engineers</text><line x1="640" x2="1120" y1="392" y2="392" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"></line><rect x="784" y="382" width="40" height="20" rx="10" fill="#FF9F8F" fill-opacity="0.4"></r