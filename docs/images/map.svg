<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Constellation map of three routes to Staff Engineer for the sample engineer. Distance to the right is months from today.">
<defs><radialGradient id="sky" cx="25%" cy="30%" r="120%"><stop offset="0" stop-color="#16204a"/><stop offset="0.55" stop-color="#0e1530"/><stop offset="1" stop-color="#0a0f22"/></radialGradient></defs>
<style>/* a dark outline behind map text keeps it readable where a line or the limit passes under it */
.map-title,
.map-value,
.map-note,
.map-limit-label{paint-order: stroke; stroke: #0b1020; stroke-width: 5px; stroke-linejoin: round;}
.map-title{font-size: 15px; font-weight: 650; letter-spacing: 0.01em;}
.map-value{font-size: 13px; fill: #eef2ff; font-weight: 550;}
.map-note,
.map-tick{font-size: 11.5px; fill: #8e9bbd;}
.map-you-label{font-size: 12.5px; font-weight: 600; fill: #eef2ff;}
.map-limit-label{font-size: 11.5px; fill: #f2c76e; font-weight: 600;}
.lane__star,
.lane__label,
.map-you{transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);}
.plan-steps-list{display: grid; gap: 12px; margin-top: 14px; padding: 0; list-style: none;}
.plan-stepcard{padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 8px;}
.plan-stepcard__head{display: flex; align-items: center; gap: 10px; flex-wrap: wrap;}
.plan-stepcard__n{flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.82rem; font-weight: 700; background: var(--accent); color: var(--on-accent);}
.plan-stepcard__what{font-size: 1rem; font-weight: 650; flex: 1 1 200px;}
.plan-stepcard__line{font-size: 0.9rem; color: var(--muted);}
.plan-step__n{font-size: 10px; font-weight: 700; fill: #fff;}
.plan-step{pointer-events: none;}</style>
<rect width="1000" height="480" rx="18" fill="url(#sky)"/>
<text x="28" y="34" fill="#eef2ff" font-size="17" font-weight="600">Your routes to Staff Engineer</text>
<text x="28" y="56" fill="#8e9bbd" font-size="12.5">Distance is months from today. Bigger star: more engineers made it. Numbers: steps of the approved plan. Synthetic cohort of 484 engineers.</text>
